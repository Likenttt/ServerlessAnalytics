# Deploys the Cloudflare Worker. Requires repository secrets:
#   CLOUDFLARE_API_TOKEN   (Workers Scripts, D1, Workers KV Storage: Edit)
#   CLOUDFLARE_ACCOUNT_ID
# ADMIN_PASSWORD is set once with `wrangler secret put` and is not managed here.
name: Deploy (Cloudflare)

on:
  workflow_dispatch:
    inputs:
      worker:
        description: Worker name
        required: true
        default: serverless-analytics-dev
      domain:
        description: Custom domain (optional, e.g. analytics.example.com)
        required: false
  push:
    branches: [main]

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck && pnpm test
      - run: pnpm --filter @serverless-analytics/dashboard build
      - name: Deploy
        working-directory: apps/cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          args=(--name "${{ inputs.worker || 'serverless-analytics-dev' }}")
          domain="${{ inputs.domain || vars.CLOUDFLARE_DOMAIN }}"
          if [ -n "$domain" ]; then args+=(--domain "$domain"); fi
          npx wrangler deploy "${args[@]}"
